name: Build and Push to Azure Container Registry

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: ACR Login via Azure CLI
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Docker Image bauen und pushen
        run: |
          IMAGE_TAG=${{ secrets.ACR_NAME }}.azurecr.io/testacr:${{ github.sha }}
          IMAGE_LATEST=${{ secrets.ACR_NAME }}.azurecr.io/testacr:latest

          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .

          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST