name: Build and Push with Azure CLI


on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build und Push in ACR ausführen
        run: |
          az acr build \
            --registry nkacr \
            --resource-group Nanako \
            --image testacr:${{ github.sha }} \
            --image testacr:latest \
            .