name: Build and Push to Azure Container Registry

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: An Azure Container Registry anmelden
        run: |
          echo "${{ secrets.AZURE_CLIENT_SECRET }}" | docker login ${{ secrets.ACR_NAME }}.azurecr.io -u ${{ secrets.AZURE_CLIENT_ID }} --password-stdin

      - name: Docker Image bauen und pushen
        run: |
          IMAGE_TAG=${{ secrets.ACR_NAME }}.azurecr.io/testacr:${{ github.sha }}
          IMAGE_LATEST=${{ secrets.ACR_NAME }}.azurecr.io/testacr:latest

          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .

          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST